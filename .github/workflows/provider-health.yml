# Provider Health Checks: do the embed providers still produce embeds in
# Discord? This deliberately does NOT gate deploys. A provider outage is a
# third party's problem, not a broken build, and gating would also block the
# very commit that switches a handler to a working provider. It alerts
# instead, on every failing run, until the provider recovers or is replaced.
name: Provider health

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: provider-health
  cancel-in-progress: false

jobs:
  health:
    name: Check embed providers
    # Discord judges the embeds, so the runner only matters for lookups the
    # bot makes itself (pin.it), which in production come from the server.
    # Pinterest stalls GitHub's hosted runners.
    runs-on: self-hosted
    # setup-python has no builds for Debian 12, so use the bot's base image
    container: python:3.13-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check providers
        env:
          HEALTH_PROBE_WEBHOOK_URL: ${{ secrets.HEALTH_PROBE_WEBHOOK_URL }}
          HEALTH_WEBHOOK_URL: ${{ secrets.HEALTH_WEBHOOK_URL }}
        run: python -m tests.health.report
