name: Build, check & deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Byte-compile all modules (catches syntax errors)
        run: python -m compileall -q .

      - name: Rewrite checks
        run: pytest -m "not network"

  build-and-push:
    name: Build & push image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name/tag (GHCR requires lowercase)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to Debian server
    needs: build-and-push
    runs-on: self-hosted
    env:
      DOCKER_CONFIG: /tmp/.docker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image and restart bot
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f

      - name: Wait for the bot to report ready
        run: |
          # A crash loop shows up as a restart under restart: unless-stopped
          restarts=$(docker inspect -f '{{.RestartCount}}' antedium)
          for _ in $(seq 1 30); do
            running=$(docker inspect -f '{{.State.Running}}' antedium)
            if [ "$running" != "true" ] || [ "$(docker inspect -f '{{.RestartCount}}' antedium)" != "$restarts" ]; then
              echo "::error::antedium container stopped or restarted after deploy"
              docker logs --tail 50 antedium
              exit 1
            fi
            if docker logs antedium 2>&1 | grep -q "Bot is ready."; then
              echo "Bot is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::antedium did not report ready within 60s"
          docker logs --tail 50 antedium
          exit 1

      - name: Clean up Docker credentials
        if: always()
        run: rm -rf /tmp/.docker
